# Fork CI (upstream has no CI; the author builds locally): build a debug APK
# on every push to main. The debug APK is signed with the debug keystore, so
# it cannot update the author's release build in place — uninstall first.
name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build the built-in Tailscale node
        run: ./tsbridge/build.sh

      - name: Prepare the build directory
        # build.gradle.kts pins outputs to /srv/avs-build (the author's machine).
        run: sudo mkdir -p /srv/avs-build && sudo chown -R "$USER" /srv/avs-build

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-vscreen-debug
          path: /srv/avs-build/app/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
